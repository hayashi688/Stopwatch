services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stopwatch
      POSTGRES_USER: stopwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD を設定してください}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stopwatch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stopwatch -d stopwatch"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  stopwatch-data:
